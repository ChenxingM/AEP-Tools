[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "aep-parser"
version = "0.1.0"
description = "Parse After Effects project files (.aep/.aepx) and output structured JSON"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "cmp094" },
]
keywords = ["after-effects", "aep", "aepx", "parser", "motion-graphics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aep-parser = "aep_parser.__main__:main"

[project.gui-scripts]
aep-viewer = "aep_parser.gui:main"

[tool.maturin]
python-source = "python"
python-packages = ["aep_parser", "aep_tools"]
module-name = "aep_parser._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
