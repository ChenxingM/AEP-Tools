[package]
name = "aep-collect"
version = "0.1.1"
edition = "2021"
description = "Lightweight AEP project file collector"

[dependencies]
serde_json = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
